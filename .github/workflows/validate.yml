name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate skill structure and scan for secrets
        run: python3 -I tools/validate.py
      - name: Compile helper scripts
        run: python3 -I -m py_compile skills/game-design/scripts/*.py
      - name: Check svg2png syntax
        run: node --check skills/game-design/scripts/svg2png.mjs
