name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate skill structure and scan for secrets
        run: python3 -I tools/validate.py
      - name: Compile helper scripts
        run: python3 -I -m py_compile skills/game-design/scripts/*.py
      - name: Check svg2png syntax
        run: node --check skills/game-design/scripts/svg2png.mjs
