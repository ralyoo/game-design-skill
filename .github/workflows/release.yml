name: release

# Push a tag like v0.1.0 to publish game-design.zip (for uploading to Claude apps
# and other tools that install a skill from a zip).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate
        run: python3 -I tools/validate.py
      - name: Build zip
        run: cd skills && python3 -I -m zipfile -c ../game-design.zip game-design
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" game-design.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
